# Dependency updates (#70): weekly, grouped so a week's updates are one PR per ecosystem, not dozens. PR checks
# (pr.yml) run on each; merge when green. Security updates come as soon as they're published, ungrouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # `typescript` is TypeScript 6, kept for svelte-check, @astrojs/check and typescript-eslint, which need its
      # JavaScript API; TypeScript 7 is `@typescript/native` and updates like anything else (ADR 0105). Drop this when
      # `typescript` becomes 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
