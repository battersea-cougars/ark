# Dependency updates (#70): weekly, grouped so a week's updates are one PR per ecosystem, not dozens. PR checks
# (pr.yml) run on each; merge when green. Security updates come as soon as they're published, ungrouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 waits until the type checkers take it: @astrojs/check and svelte-check accept ^5 || ^6 only
      # (2026-11-01; #91 failed the website's check). Drop this once both do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
