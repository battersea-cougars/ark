name: Secrets scan

# The whole git history, scanned for secrets with gitleaks (#104, ADR 0002): on every push to main, so nothing lands
# there unscanned, and weekly with whatever the pinned rules have learned since. A PR's own commits are scanned in
# pr.yml. Findings are redacted (scripts/secrets-scan.mjs); what's let through, and why, is in .gitleaks.toml. A find
# fails the run: rotate the secret first (docs/secrets.md), then take it out of the history.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays, some time after 05:23 UTC (off the round minutes: GitHub runs those late)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Only Node's own modules: no install needed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run secrets:scan
