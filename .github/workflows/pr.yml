name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# No secrets here: the site builds from fallback content without Sanity.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: npm run lint
      # The files past the size prompts (ADR 0125): a report, never a failure
      - run: npm run sizes
      - run: npm test
      - run: npm run check -w @cougars/web
      # The team app's pages (svelte-check) and its Worker (tsc)
      - run: npm run check -w @cougars/team
      - run: npm run build
      - run: npm run build -w @cougars/team
      - run: npm run build -w @cougars/studio
