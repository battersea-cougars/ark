name: Deploy

# Branches map to environments like Ark (docs/adr/0010-environments-and-deploys.md), each on its own Cloudflare account
# (docs/adr/0010-environments-and-deploys.md):
# pull request    -> dev: a preview version of `web`, commented on the PR
# main            -> dev: workers `web` and `team`, Cougars Dev account
# release         -> production: workers `web` and `team` and the hosted Studio, Cougars account
# schedule        -> daily production rebuild, so Studio changes go live (docs/adr/0004). It runs on the default
#                    branch, which the `production` environment refuses, so its only job (`rebuild`) starts this
#                    workflow again on `release`.
# manual run      -> the apps picked, from the branch it's run on. The team app's GitHub App runs it this way
#                    (`apps: web`, on `main` or `release`) when a result changes (ADR 0100), with a token that can
#                    only start workflows (#71).
# GitHub environment `production` (release only) holds BWS_ACCESS_TOKEN__PRODUCTION; `preview` holds
# BWS_ACCESS_TOKEN__DEV, which can't read production secrets.
#
# Each app is its own job, and a push or PR deploys only the apps its files touch (`changes`). The shared D1 database is
# a job of its own too (`database`), run first when the schema or seed changes; otherwise the apps start together.
# Jobs use their environment's secrets without listing a deploy (`deployment: false`); scripts/ci/link-deployment.sh
# lists each app on the Deployments page under its own name, linked to where it runs.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *" # daily, 04:30 UTC
  workflow_dispatch:
    inputs:
      apps:
        description: Which apps to deploy
        type: choice
        options: [all, web, team]
        default: all

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.ref == 'refs/heads/release' && 'production' || github.event_name == 'schedule' && 'rebuild' || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The least each job needs, widened per job where it must: listing a deploy (scripts/ci/link-deployment.sh), the PR
# comment
permissions:
  contents: read

jobs:
  # The daily schedule: deploy production's website from `release` by running this workflow again there.
  rebuild:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the website from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/release" --silent 2>/dev/null; then
            gh workflow run deploy.yml --repo "${{ github.repository }}" --ref release -f apps=web
          else
            echo "No release branch yet: nothing is live, nothing to rebuild."
          fi

  # What this run deploys. A push or PR: what its files touch (shared code, the schema, the lockfile and this workflow
  # count for every app). A manual run: the `apps` input, and `all` also rebuilds the database (say, to seed a roster
  # change).
  changes:
    # Forks don't get secrets; their PRs are covered by pr.yml. The schedule only starts `rebuild`.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.apps.outputs.web }}
      team: ${{ steps.apps.outputs.team }}
      studio: ${{ steps.apps.outputs.studio }}
      database: ${{ steps.apps.outputs.database }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: apps
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          APPS: ${{ inputs.apps || 'all' }}
        run: |
          shared='package\.json|package-lock\.json|\.nvmrc|packages/shared/|db/|\.github/workflows/deploy\.yml|\.github/actions/'
          declare -A pattern=(
            [web]="^(apps/web/|scripts/|$shared)"
            [team]="^(apps/team/|scripts/ci/|$shared)"
            [studio]="^(apps/studio/|$shared)"
            [database]="^(db/|scripts/db-(rebuild|backup|migrate)\.mjs|scripts/seed-roster\.mjs|scripts/lib/roster|scripts/ci/target\.mjs|\.github/workflows/deploy\.yml)"
          )
          # A PR is checked out as a merge commit: its first parent is the base. A new branch has no `before`.
          base=
          [ "$EVENT" = pull_request ] && base=$(git rev-parse HEAD^1)
          [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base=$BEFORE
          if [ -n "$base" ]; then
            files=$(git diff --name-only "$base" HEAD)
            echo "Changed since ${base:0:7}:"; echo "$files"
          fi
          for app in web team studio database; do
            if [ -n "$base" ]; then
              grep -qE "${pattern[$app]}" <<<"$files" && on=true || on=false
            else
              [ "$APPS" = all ] || [ "$APPS" = "$app" ] && on=true || on=false
            fi
            echo "$app: $on"
            echo "$app=$on" >> "$GITHUB_OUTPUT"
          done

  # Backed up first (sealed, kept 90 days as an artifact: ADR 0106), then brought up to date. Until launch there are no
  # migrations (ADR 0050): dev is rebuilt from db/schema.sql, keeping its data, topped up with the club's seed. Production
  # never rebuilds: it starts at launch from the migrations scripts/db-launch.mjs makes, and only ever migrates. Then the
  # team roster. Each environment has its own database, so a PR changes dev, never production. Both apps read it, so
  # they wait for this job when it runs.
  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
      deployment: false
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/release' && 'production' || 'dev' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets
        with:
          environment: ${{ env.SITE_ENV }}
          token: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION || secrets.BWS_ACCESS_TOKEN__DEV }}

      # A config naming only this environment's database (creates it once)
      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV" db

      - name: Back up before changing it
        working-directory: apps/web
        run: node ../../scripts/db-backup.mjs --remote -c dist/d1/wrangler.json --why "before deploy" --out ../../backups

      - name: Keep the backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d1-${{ env.SITE_ENV }}-before-deploy-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error

      # Production rebuilds like dev until it's launched (the production environment's variable LAUNCHED, ADR 0050):
      # before that it's behind Cloudflare Access with only the admins' data, which a rebuild keeps
      - name: Migrate, or rebuild before launch
        working-directory: apps/web
        env:
          LAUNCHED: ${{ github.ref == 'refs/heads/release' && vars.LAUNCHED || '' }}
        run: |
          if ls ../../db/migrations/*.sql >/dev/null 2>&1; then
            node ../../scripts/db-migrate.mjs --remote -c dist/d1/wrangler.json
          elif [ "$LAUNCHED" = true ]; then
            echo "::error::Production is launched, so it never rebuilds its database (ADR 0050): node scripts/db-launch.mjs"
            exit 1
          else
            node ../../scripts/db-rebuild.mjs --remote -c dist/d1/wrangler.json
          fi

      # The team roster: personal data, so it lives in Secrets Manager (TEAM_ROSTER), never in this public repo
      # (ADR 0029). Adds players who aren't there yet and changes no one. Dev's are made-up people, bar the admins.
      - name: Seed the team roster
        working-directory: apps/web
        run: node ../../scripts/seed-roster.mjs --remote -c dist/d1/wrangler.json ${{ github.ref != 'refs/heads/release' && '--anonymous' || '' }}

  web:
    needs: [changes, database]
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' && needs.database.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
      deployment: false
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/release' && 'production' || 'dev' }}
      # Production's address; target.mjs attaches it to the worker. Dev stays on workers.dev (a separate account).
      SITE_URL: ${{ github.ref == 'refs/heads/release' && 'https://batterseacougars.com' || '' }}
      # Dev: sample content where Sanity's dev dataset is empty, and noindex. Production too while the
      # `production` environment's variable DEMO_CONTENT is `true` (until real content is in Sanity).
      DEMO_CONTENT: ${{ github.ref == 'refs/heads/release' && (vars.DEMO_CONTENT || 'false') || 'true' }}
      # Each account's Turnstile widget (public site keys; scripts/turnstile-setup.mjs made them, README#turnstile)
      TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/release' && '0x4AAAAAAFTLssDmpWrRRwXt' || '0x4AAAAAAFTLrONmM47TYB4-' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets
        with:
          environment: ${{ env.SITE_ENV }}
          # Each GitHub environment holds only its own: BWS_ACCESS_TOKEN__PRODUCTION or BWS_ACCESS_TOKEN__DEV
          token: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION || secrets.BWS_ACCESS_TOKEN__DEV }}

      # Dev (no domain of its own) lives at web.<account subdomain>.workers.dev
      - name: Site URL
        if: env.SITE_URL == ''
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          echo "SITE_URL=https://web.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Build version
        run: echo "PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d)+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The roster is a snapshot of this environment's D1 (scripts/club-snapshot.mjs, apps/web's prebuild, ADR 0043).
      - name: Build
        run: npm run build
        env:
          CLUB_SNAPSHOT_ENV: ${{ env.SITE_ENV }}

      # Worker name, D1 database and SITE_ENV for this environment (creates the database once)
      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV"

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: |
          out=$(npx wrangler deploy --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1)
          echo "url=${SITE_URL:-$url}" >> "$GITHUB_OUTPUT"

      # Secrets the Worker reads at request time, from this environment's Secrets Manager project (README#secrets).
      # PR previews share dev's. One that isn't there yet is skipped: the site does without (no live YouTube; emails
      # logged, not sent; no auto-replies).
      - name: Worker secrets
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: |
          for name in YOUTUBE_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN TURNSTILE_SECRET_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" -c dist/server/wrangler.json
            else
              echo "$name: not in Secrets Manager for $SITE_ENV, skipped"
            fi
          done

      - name: Upload preview
        id: preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          out=$(npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: node scripts/ci/smoke-test.mjs "${{ steps.preview.outputs.url || steps.deploy.outputs.url }}" "$PUBLIC_BUILD_VERSION"

      - name: Link the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/link-deployment.sh "web (${{ github.event_name == 'pull_request' && 'PR preview' || env.SITE_ENV }})" \
            "${{ steps.preview.outputs.url || steps.deploy.outputs.url }}" ${{ env.SITE_ENV == 'production' && 'production' || '' }}

      # With GitHub's own CLI, not a third-party action: this job has every dev secret loaded (#70)
      - name: Comment preview URL
        if: steps.preview.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: "Preview: ${{ steps.preview.outputs.url }} (`${{ env.PUBLIC_BUILD_VERSION }}`)"
        # Edits this job's last comment on the PR, or makes the first
        run: |
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --edit-last --body "$BODY" ||
            gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body "$BODY"

  # The team app (ADR 0010): its own worker `team` on the environment's account and D1, from main (dev) or release
  # (production, at team.<the site's domain>). PRs get no preview (a Worker with a Durable Object can't have preview
  # versions); pr.yml checks them.
  team:
    needs: [changes, database]
    permissions:
      contents: read
      deployments: write
    if: >-
      !cancelled() && needs.changes.outputs.team == 'true' && needs.database.result != 'failure' &&
      github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
      deployment: false
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/release' && 'production' || 'dev' }}
      # Production's site; target.mjs puts the team app on team.<its domain>. Dev stays on workers.dev.
      SITE_URL: ${{ github.ref == 'refs/heads/release' && 'https://batterseacougars.com' || '' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets
        with:
          environment: ${{ env.SITE_ENV }}
          token: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION || secrets.BWS_ACCESS_TOKEN__DEV }}

      - name: Build version
        run: echo "PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d)+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build -w @cougars/team

      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV" team

      # `wrangler deploy`, not a previews-only upload, so the live hub's Durable Object migration is applied (ADR 0072)
      - name: Deploy
        id: deploy
        working-directory: apps/team
        run: |
          out=$(npx wrangler deploy -c dist/cougars_team/wrangler.json --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1)
          [ -n "$SITE_URL" ] && url="https://team.${SITE_URL#https://}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Worker secrets
        working-directory: apps/team
        run: |
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN CLOUDFLARE_ANALYTICS_TOKEN GITHUB_APP_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" -c dist/cougars_team/wrangler.json
            else
              echo "$name: not in Secrets Manager for $SITE_ENV, skipped"
            fi
          done

      # A brand-new address can take a while to answer (a workers.dev name seconds, a new domain's certificate
      # minutes). Health reads the database, so a broken binding fails here. Then, with no session, the club is closed
      # (401): the local-only switches (ADR 0023) are off, as a deploy must have them. Before launch production is
      # behind Cloudflare Access; CI gets past it with its service token (CF_ACCESS_CLIENT_ID/SECRET, ADR 0010).
      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          access=()
          [ -n "$CF_ACCESS_CLIENT_ID" ] &&
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          c() { curl -s "${access[@]}" "$@"; }
          for i in $(seq 30); do
            code=$(c -o /dev/null -w '%{http_code}' "$url/api/health")
            echo "$url/api/health answered $code"
            [ "$code" = 200 ] && break
            [ "$i" = 30 ] && exit 1
            sleep 10
          done
          closed=$(c -o /dev/null -w '%{http_code}' "$url/api/bootstrap")
          echo "$url/api/bootstrap without a session answered $closed"
          [ "$closed" = 401 ]
          live=$(c -o /dev/null -w '%{http_code}' "$url/api/live")
          echo "$url/api/live without a session answered $live"
          [ "$live" = 401 ]
          dev=$(c -o /dev/null -w '%{http_code}' -X POST -H "origin: $url" -H 'content-type: application/json' -d '{}' "$url/api/auth/dev")
          echo "$url/api/auth/dev (local sign-in) answered $dev"
          [ "$dev" != 200 ]
          framed=$(c -o /dev/null -D - "$url/" | grep -ic "^x-frame-options: DENY")
          echo "$url/ carries X-Frame-Options: $framed"
          [ "$framed" = 1 ]

      - name: Link the team app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/link-deployment.sh "team (${{ env.SITE_ENV }})" "${{ steps.deploy.outputs.url }}" \
            ${{ env.SITE_ENV == 'production' && 'production' || '' }}

  # The Studio (https://battersea-cougars.sanity.studio) ships with production: from `release` only
  # (docs/adr/0010-environments-and-deploys.md). Cougars Dev's Studio runs locally (port 4520), not hosted.
  studio:
    needs: changes
    permissions:
      contents: read
      deployments: write
    if: needs.changes.outputs.studio == 'true' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets
        with:
          environment: production
          token: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION }}

      # SANITY_DEPLOY_TOKEN, not SANITY_STUDIO_*: the Studio build bundles SANITY_STUDIO_* variables into the
      # public JavaScript.
      - name: Deploy Studio
        run: npm run deploy -w @cougars/studio -- --yes
        env:
          # The live project (packages/shared/sanity.ts, ADR 0010)
          SANITY_STUDIO_SITE_ENV: production
          SANITY_AUTH_TOKEN: ${{ env.SANITY_DEPLOY_TOKEN }}

      - name: Link the Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/link-deployment.sh "studio (production)" https://battersea-cougars.sanity.studio production
