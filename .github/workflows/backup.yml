name: Back up

# The club's database, every night (ADR 0106): exported, sealed with the environment's BACKUP_KEY
# (scripts/db-backup.mjs) and kept 90 days as an artifact of this run. The team app's Usage page says when the last one
# was. deploy.yml also takes one before it changes the schema. To read one back: db/README.md, Restore.
#
# The schedule runs on the default branch, which the `production` environment refuses, so it backs up dev there and
# starts this workflow again on `release` for production (as deploy.yml's rebuilds do). A manual run backs up the
# environment of the branch it's run on.
on:
  schedule:
    - cron: "15 3 * * *" # nightly, 03:15 UTC
  workflow_dispatch:
    inputs:
      why:
        description: Why (shown on the Usage page)
        type: string
        default: by hand

concurrency:
  group: backup-${{ github.ref }}

permissions:
  contents: read

jobs:
  production:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Back up production from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/release" --silent 2>/dev/null; then
            gh workflow run backup.yml --repo "${{ github.repository }}" --ref release -f why=nightly
          else
            echo "No release branch yet: nothing is live, nothing to back up."
          fi

  backup:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
      deployment: false
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/release' && 'production' || 'dev' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/secrets
        with:
          environment: ${{ env.SITE_ENV }}
          token: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION || secrets.BWS_ACCESS_TOKEN__DEV }}

      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV" db

      - name: Back up
        run: >-
          node scripts/db-backup.mjs --remote -c apps/web/dist/d1/wrangler.json
          --why "$WHY" --out backups
        env:
          WHY: ${{ inputs.why || 'nightly' }}

      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-${{ env.SITE_ENV }}-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
