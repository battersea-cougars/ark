name: Setup
description: Node from .nvmrc and the installed node_modules, restored from a cache keyed on the lockfile (npm ci on a miss)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    # npm ci was most of every job (45-75 s of a 2-minute deploy). The installed tree itself is cached, per OS and
    # architecture (native modules: better-sqlite3, sharp, workerd), Node version and lockfile, and saved straight
    # after the install, before a build writes its caches into it.
    - id: modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - if: steps.modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
