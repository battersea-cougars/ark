name: Secrets
description: Install the Bitwarden Secrets Manager CLI and load one environment's secrets into the job (ADR 0002)
inputs:
  environment:
    description: production or dev
    required: true
  token:
    description: That environment's Bitwarden token (BWS_ACCESS_TOKEN__PRODUCTION or BWS_ACCESS_TOKEN__DEV)
    required: true
runs:
  using: composite
  steps:
    - name: Install Bitwarden Secrets Manager CLI
      shell: bash
      # It handles the token that unlocks every secret, so it's checked against the release's published checksum
      # before it runs (bws-sha256-checksums-2.1.0.txt). A new version means new checksums here. Linux for the deploys,
      # macOS for the store app's build (ADR 0108).
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          zip=bws-macos-universal-2.1.0.zip; sum=286159545c7c834d93785c5a86e91d51026a5cc9858713936f391beb1ead2524
        else
          zip=bws-x86_64-unknown-linux-gnu-2.1.0.zip; sum=ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
        fi
        curl -fsSL -o "$RUNNER_TEMP/bws.zip" "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/$zip"
        echo "$sum  $RUNNER_TEMP/bws.zip" | shasum -a 256 --check --strict
        sudo unzip -o "$RUNNER_TEMP/bws.zip" -d /usr/local/bin

    - name: Load secrets from Bitwarden
      shell: bash
      run: node scripts/env-pull.mjs --github-env --environment "${{ inputs.environment }}"
      env:
        BWS_ACCESS_TOKEN: ${{ inputs.token }}
