<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0b" />
    <meta name="apple-mobile-web-app-title" content="Cougars Fresh Meat" />
    <meta name="application-name" content="Cougars Fresh Meat" />
    <meta name="robots" content="noindex" />
    <title>Cougars Fresh Meat</title>
    <!-- The club's data, asked for at once, beside the app's files rather than after them: main.ts's fetch picks this
         reply up (same address, same credentials). A cookie-less 401 is picked up the same way, for sign-in. -->
    <link rel="preload" href="/api/bootstrap" as="fetch" crossorigin />
    <!-- The two faces, fetched before the stylesheet asks for them, so the first paint is in the right type -->
    <link rel="preload" href="/src/assets/fonts/InterTight-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Anton.woff2" as="font" type="font/woff2" crossorigin />
    <!-- With its cookies: behind Cloudflare Access (ADR 0010) a manifest fetched without them is sent to the login page -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The splash's own styles, here so it paints before the stylesheet or any script arrives -->
    <style>
      /* The page's colour on html, never body: an opaque body would cover the carbon mesh (app.css, body::before) */
      html {
        background: #0e0d0b;
      }
      body {
        margin: 0;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        background: #0e0d0b;
        transition: opacity 160ms ease-out;
      }
      #splash.gone {
        opacity: 0;
      }
      #splash img {
        width: 4.5rem;
        height: auto;
      }
      #splash p {
        margin: 0;
        font:
          600 0.6875rem/1 "Inter Tight",
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a6a09a;
      }
      /* A short red line running under the name while the club loads */
      #splash .run {
        position: relative;
        width: 4.5rem;
        height: 2px;
        overflow: hidden;
        background: rgb(239 232 225 / 0.07);
      }
      #splash .run::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: #f4404a;
        animation: splash-run 1.1s ease-in-out infinite;
      }
      @keyframes splash-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .run::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <!-- While the club loads (main.ts takes it away once the first screen is up) -->
    <div id="splash" role="status" aria-label="Loading">
      <img src="/src/assets/cougars-mark.webp" alt="" width="72" height="72" />
      <p>Battersea Cougars</p>
      <div class="run"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
